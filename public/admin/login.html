<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Login · Admin Su Beauty Touch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/main.css">
  <link rel="stylesheet" href="../assets/css/admin.css">
  <script src="../assets/js/theme.js"></script>
  <script type="module" src="../assets/js/admin/login.js"></script>
</head>
<body class="admin-body" data-page="login">
  <main class="container admin-login fade-in">
    <h1>Área Administrativa</h1>
    <form id="admin-login-form" class="form-login">
      <div class="form-group">
        <label for="admin-email">Email</label>
        <input type="email" id="admin-email" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="admin-password">Palavra-passe</label>
        <input type="password" id="admin-password" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit">Entrar</button>
      <button class="link-btn" type="button" id="forgot-password">Esqueci a palavra-passe</button>
      <p id="msg" class="mensagem" role="alert"></p>
    </form>
  </main>
</body>
</html>
